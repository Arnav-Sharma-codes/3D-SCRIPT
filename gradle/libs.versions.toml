[versions]
kotlin             = "2.1.21"
compose            = "1.8.2"
ktor               = "3.2.1"
kotlinx-serialization = "1.8.1"
kotlinx-coroutines = "1.10.2"
logback            = "1.5.18"
pdfbox             = "3.0.8"

[libraries]
# Ktor Server
ktor-server-core          = { module = "io.ktor:ktor-server-core",             version.ref = "ktor" }
ktor-server-cio           = { module = "io.ktor:ktor-server-cio",              version.ref = "ktor" }
ktor-server-content-neg   = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors          = { module = "io.ktor:ktor-server-cors",             version.ref = "ktor" }
ktor-server-call-logging  = { module = "io.ktor:ktor-server-call-logging",     version.ref = "ktor" }

# Ktor Client
ktor-client-core          = { module = "io.ktor:ktor-client-core",             version.ref = "ktor" }
ktor-client-cio           = { module = "io.ktor:ktor-client-cio",              version.ref = "ktor" }
ktor-client-content-neg   = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

# Serialization
ktor-serialization-json   = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization     = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

# Logging
logback                   = { module = "ch.qos.logback:logback-classic",       version.ref = "logback" }
pdfbox                    = { module = "org.apache.pdfbox:pdfbox",              version.ref = "pdfbox" }

[plugins]
kotlin-jvm         = { id = "org.jetbrains.kotlin.jvm",                       version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform",           version.ref = "kotlin" }
compose-desktop    = { id = "org.jetbrains.compose",                          version.ref = "compose" }
compose-compiler   = { id = "org.jetbrains.kotlin.plugin.compose",            version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",    version.ref = "kotlin" }
