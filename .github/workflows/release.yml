name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew :app:packageDmg
      - run: |
          mkdir release-assets
          cp "$(find app/build/compose/binaries -type f -name '*.dmg' -print -quit)" "release-assets/3D-Script-Studio-${GITHUB_REF_NAME}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release-assets/*.dmg

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: .\gradlew.bat :app:packageMsi
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets
          $msi = Get-ChildItem app/build/compose/binaries -Recurse -Filter *.msi | Select-Object -First 1
          Copy-Item $msi.FullName "release-assets/3D-Script-Studio-${env:GITHUB_REF_NAME}-Windows.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: release-assets/*.msi

  build-jar:
    name: Build portable JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew :app:packageUberJarForCurrentOS
      - run: |
          mkdir release-assets
          cp "$(find app/build/compose/jars -maxdepth 1 -type f -name '*.jar' -print -quit)" "release-assets/3D-Script-Studio-${GITHUB_REF_NAME}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-jar
          path: release-assets/*.jar

  publish:
    name: Create GitHub prerelease
    needs: [build-macos, build-windows, build-jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --prerelease --title "$GITHUB_REF_NAME" --generate-notes
